name: K-Defense News Monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send Telegram test message only (skip news search)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: kdefense-monitor-db
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository with previous article history
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Send Telegram test message
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --test-telegram
      - name: Look for new articles and send Telegram alerts
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DB_PATH: data/articles.db
          LOOKBACK_HOURS: '6'
          SEED_ON_FIRST_RUN: 'true'
          ENABLE_GOOGLE_RSS: 'true'
          ENABLE_DIRECT_RSS: 'true'
          ENABLE_GDELT: 'false'
          MIN_SCORE: '3'
        run: python monitor.py
      - name: Persist seen article IDs across workflow runs
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        run: |
          if [ ! -f data/articles.db ]; then
            echo 'No database generated; nothing to save.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/articles.db
          if git diff --cached --quiet; then
            echo 'No new state to save.'
            exit 0
          fi
          git commit -m 'chore: save news alert state [skip ci]'
          git push
